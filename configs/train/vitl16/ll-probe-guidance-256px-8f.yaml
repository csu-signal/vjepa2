app: vjepa_ll_probe_guidance
cpus_per_task: 12
folder: ./outputs/ll_probe_guidance_vitl_rollout_curriculum
mem_per_gpu: 220G
nodes: 1 
tasks_per_node: 1
data:
  data_root: /home/jack/data/probe_guidance_dataset_june/train
  val_data_root: /home/jack/data/probe_guidance_dataset_june/val
  batch_size: 4
  val_batch_size: 16
  frames_per_clip: 8
  fps: 4
  num_workers: 8
  patch_size: 16
  pin_mem: true
  stereo_view: false
  tubelet_size: 2
loss:
  auto_steps: 8
  use_rollout_curriculum: true
  loss_exp: 1.0
  normalize_reps: true
  reg_coeff: 0.0
meta:
  dtype: bfloat16
  eval_freq: 25
  resume_checkpoint: null
  load_predictor: false
  pretrain_checkpoint: /home/jack/code/vjepa2-probe-guidance/checkpoints/vitl.pt
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  save_every_freq: 25
  seed: 239
  use_sdpa: true
model:
  model_name: vit_large
  predictor_type: "ac"
  patch_size: 16
  pred_depth: 12 
  pred_embed_dim: 768
  pred_num_heads: 12
  action_embed_dim: 6
  use_extrinsics: false
  use_rope: true
optimization:
  anneal: 15
  epochs: 315
  final_lr: 0.0
  final_weight_decay: 0.04
  ipe: 300
  lr: 0.0001
  start_lr: 0.00001
  warmup: 15
  weight_decay: 0.04
