  loss_exp: 1.0
  normalize_reps: true
  reg_coeff: 0.0
meta:
  dtype: bfloat16
  eval_freq: 100
  resume_checkpoint: latest.pt
  pretrain_checkpoint: /home/jack/code/vjepa2-probe-guidance/checkpoints/vitl.pt
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  save_every_freq: 25
  seed: 239
  use_sdpa: true
model:
  model_name: vit_large
  predictor_type: "ac"
  patch_size: 16
  pred_depth: 12 
  pred_embed_dim: 768
  pred_num_heads: 12
  action_embed_dim: 6
  use_extrinsics: false
  use_rope: true
