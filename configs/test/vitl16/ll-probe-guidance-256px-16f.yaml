app: vjepa_ll_probe_guidance
cpus_per_task: 12
folder: ./outputs/ll_probe_guidance_vitl_16f
mem_per_gpu: 220G
nodes: 1 
tasks_per_node: 1
data:
  data_root: /home/jack/data/ll_probe_tracking_dataset_v1/test
  stats_file: /home/jack/data/ll_probe_tracking_dataset_v1/stats_probe_local_tip.json
  batch_size: 16
  frames_per_clip: 16
  fps: 4
  num_workers: 8
  patch_size: 16
  crop_size: 256
